name: Pipeline dat

on:
  schedule:
    # Každou hodinu v 17. minutě — mimo celou hodinu, kdy má web města špičku.
    - cron: '17 * * * *'
  workflow_dispatch:

# Pipeline commituje vygenerovaná data zpět do repozitáře a při potížích zakládá issue.
permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  generuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Web města některým runnerům neodpovídá (ETIMEDOUT), jiným ano. Bez zaznamenané
      # IP se to nedá vyhodnotit — viz docs/ZDROJE.md, kap. 11a.
      - name: Odkud voláme
        run: |
          echo -n "odchozí IP: "
          curl -sS --max-time 20 https://api.ipify.org || echo "(nezjištěno)"
          echo ""
          UA="MojeKladnoBot/1.0 (+https://github.com/Agillis24/kladno)"
          curl -sS -4 --max-time 30 -o /dev/null -A "$UA" \
            -w "kontrolní curl na web města: HTTP=%{http_code} za %{time_total}s\n" \
            https://www.mestokladno.cz/robots.txt || echo "kontrolní curl selhal, exit $?"

      - name: Generuj data
        run: pnpm pipeline

      - name: Commitni data, pokud se změnila
        run: |
          git config user.name "moje-kladno-bot"
          git config user.email "noreply@github.com"
          git add data/v1
          if git diff --cached --quiet; then
            echo "Data beze změny, není co commitovat."
          else
            git commit -m "chore(data): aktualizace $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Založ issue, když se některý zdroj nepodařilo aktualizovat
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pipeline-problems.json')) return;

            const problems = JSON.parse(fs.readFileSync('pipeline-problems.json', 'utf8'));
            if (problems.length === 0) return;

            // Web města neodpovídá některým runnerům GitHub Actions (docs/ZDROJE.md,
            // kap. 11a). Takový výpadek spraví další běh cronu sám, takže z něj issue
            // neděláme — jinak by jich vznikaly desítky denně. Zakládáme je, jen když
            // zdroj odpověděl jinak, než čekáme (změna formátu), nebo když data
            // opravdu zestárnou.
            const dataProblems = problems.filter((p) => p.kind !== 'network');

            let staleHours = 0;
            try {
              const manifest = JSON.parse(fs.readFileSync('data/v1/index.json', 'utf8'));
              for (const entry of Object.values(manifest.datasets)) {
                if (!entry.stale) continue;
                const hours = (Date.now() - Date.parse(entry.lastSuccessfulFetch)) / 3_600_000;
                staleHours = Math.max(staleHours, hours);
              }
            } catch {
              // Bez manifestu se rozhodujeme jen podle typu problémů.
            }

            const STALE_LIMIT_HOURS = 12;
            if (dataProblems.length === 0 && staleHours < STALE_LIMIT_HOURS) {
              console.log(
                `Jen přechodné síťové chyby (${problems.length}), nejstarší data ` +
                  `${staleHours.toFixed(1)} h. Issue nezakládám, spraví to další běh.`,
              );
              return;
            }

            const title = `Pipeline: ${problems.length} zdroj(ů) se nepodařilo aktualizovat`;
            const body = [
              'Pipeline doběhla, ale u těchto datasetů zůstala předchozí verze dat:',
              '',
              ...problems.map((p) => `- **${p.dataset}** (${p.kind === 'network' ? 'síť' : 'data'}) — ${p.message}`),
              '',
              'Data v `data/v1/` jsou tedy zastaralá a v `index.json` mají `stale: true`.',
              `Nejstarší úspěšné stažení je ${staleHours.toFixed(1)} h zpět.`,
              '',
              dataProblems.length > 0
                ? 'Aspoň jeden zdroj odpověděl jinak, než čekáme — zkontrolujte fixtures a testy.'
                : `Jde jen o síťové chyby, ale trvají déle než ${STALE_LIMIT_HOURS} h. Spusťte workflow „Diagnostika dostupnosti webu města".`,
              '',
              `Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            // Otevřené issue se stejným názvem se jen doplní, ať nevzniká hromada duplikátů.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline',
            });
            const match = existing.data.find((issue) => issue.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pipeline'],
              });
            }
