name: Diagnostika dostupnosti webu města

# Pomůcka pro případ, kdy pipeline hlásí síťové chyby, které se lokálně nedají
# zopakovat. Runner běží v Azure (typicky East US) a chová se jinak než české
# připojení.
#
# Vlastní testy jsou v pipeline/src/diagnostika.ts, tady je jen obal a pár
# kontrolních curlů pro srovnání s tím, co dělá Node.
#
# Spouští se jen ručně. Neběží v žádném plánu a nic nezapisuje.
on:
  workflow_dispatch:

jobs:
  zjisti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Odkud voláme
        run: |
          echo -n "odchozí IP: "
          curl -sS --max-time 20 https://api.ipify.org
          echo ""

      - name: curl pro srovnání
        run: |
          UA="MojeKladnoBot/1.0 (+https://github.com/Agillis24/kladno)"
          curl -sS -4 --max-time 30 -o /dev/null -A "$UA" \
            -w "curl IPv4      HTTP=%{http_code} time=%{time_total}\n" \
            https://www.mestokladno.cz/robots.txt || echo "curl IPv4 EXIT=$?"
          curl -sS -6 --max-time 30 -o /dev/null -A "$UA" \
            -w "curl IPv6      HTTP=%{http_code} time=%{time_total}\n" \
            https://www.mestokladno.cz/robots.txt || echo "curl IPv6 EXIT=$?"
          curl -sS --http1.1 --max-time 30 -o /dev/null -A "$UA" \
            -w "curl HTTP/1.1  HTTP=%{http_code} time=%{time_total}\n" \
            https://www.mestokladno.cz/robots.txt || echo "curl HTTP/1.1 EXIT=$?"

      - name: Co na to Node
        run: pnpm --filter @kladno/pipeline run diag
